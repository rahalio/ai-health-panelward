openapi: 3.0.3
info:
  title: Panelward
  version: 0.1.0
  description: >-
    Clinical demand-and-capacity system for health systems. Panelward captures care
    requests that never became encounters, computes unmet demand against
    specialty access windows, evaluates each request against a ratified
    scope-of-automation policy before any absorption occurs, follows absorbed
    requests for downstream escalation, and reconciles recovered clinician minutes
    to payroll.
  x-product-slug: ai-health-panelward
  x-source: ai-in-health/Accenture-Chart-AI-Can-Address-Demand/
servers:
  - url: https://api.example.com
tags:
  - name: Demand
    description: Request-level demand ledger and unmet-demand measurement
  - name: Capacity
    description: Available clinician minutes, panels, and access-window standards
  - name: Automation Policies
    description: Ratified, expiring scope-of-automation policies and suspensions
  - name: Absorption
    description: Eligibility evaluation, dispositions, and escalation clocks
  - name: Safety Surveillance
    description: Look-back outcome surveillance and safety signals
  - name: Equity
    description: Subgroup absorption, escalation, and miss-rate monitoring
  - name: Recovery Reporting
    description: Recovered clinician minutes reconciled to payroll and access outcomes
  - name: Governance
    description: Policy reviews, patient preferences, and the evidentiary record
paths:
  /v1/demand/requests:
    get:
      operationId: listDemandRequests
      tags: [Demand]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: siteId
          in: query
          schema:
            type: string
        - name: specialty
          in: query
          schema:
            type: string
        - name: conversionState
          in: query
          schema:
            type: string
            enum: [open, converted, absorbed, expired_unmet, abandoned]
      responses:
        "200":
          description: Demand requests page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDemandRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: ingestDemandRequest
      tags: [Demand]
      description: >-
        Records a care request from telephony, portal, scheduling, referral, or
        registration, including requests that were abandoned before conversion.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandRequestCreate"
      responses:
        "201":
          description: Request recorded and segmented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDemandRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/demand/requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getDemandRequest
      tags: [Demand]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Demand request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDemandRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/demand/gap-measurements:
    get:
      operationId: listGapMeasurements
      tags: [Demand]
      description: >-
        Unmet demand per site, specialty, and panel against access-window standards,
        with the counted population and exclusions stated on the result.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: period
          in: query
          schema:
            type: string
            example: 2026-W36
        - name: specialty
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Gap measurements page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeGapMeasurement"
  /v1/capacity/snapshots:
    get:
      operationId: listCapacitySnapshots
      tags: [Capacity]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: siteId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Capacity snapshots page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCapacitySnapshot"
    post:
      operationId: recordCapacitySnapshot
      tags: [Capacity]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapacitySnapshotCreate"
      responses:
        "201":
          description: Capacity snapshot recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapacitySnapshot"
  /v1/capacity/access-window-standards:
    get:
      operationId: listAccessWindowStandards
      tags: [Capacity]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Access-window standards by specialty and clinical category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAccessWindowStandard"
    put:
      operationId: setAccessWindowStandard
      tags: [Capacity]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessWindowStandard"
      responses:
        "200":
          description: Standard set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAccessWindowStandard"
  /v1/capacity/panels/{panelId}:
    parameters:
      - name: panelId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPanelAssignment
      tags: [Capacity]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Panel assignment with owning clinician and exclusions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePanelAssignment"
  /v1/automation-policies:
    get:
      operationId: listAutomationPolicies
      tags: [Automation Policies]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, ratified, suspended, lapsed, retired]
      responses:
        "200":
          description: Policies page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAutomationPolicy"
    post:
      operationId: draftAutomationPolicy
      tags: [Automation Policies]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationPolicyCreate"
      responses:
        "201":
          description: Policy drafted, inactive until ratified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAutomationPolicy"
  /v1/automation-policies/{policyId}/ratification:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    post:
      operationId: ratifyAutomationPolicy
      tags: [Automation Policies]
      description: >-
        Clinical governance ratification. Requires an accountable clinician and an
        expiry date after which the policy lapses closed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRatificationCreate"
      responses:
        "201":
          description: Policy ratified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePolicyRatification"
        "403":
          description: Caller does not hold governance ratification authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/automation-policies/{policyId}/suspension:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    post:
      operationId: suspendAutomationPolicy
      tags: [Automation Policies]
      description: >-
        Immediately halts absorption under this policy and reroutes in-flight
        absorbed requests to human handling.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, suspendedBy]
              properties:
                reason:
                  type: string
                  enum:
                    - safety_signal
                    - subgroup_disparity
                    - escalation_breach_rate
                    - regulatory_change
                    - operational_request
                detail:
                  type: string
                suspendedBy:
                  type: string
                rerouteInFlight:
                  type: boolean
                  default: true
      responses:
        "202":
          description: Suspension accepted, in-flight requests rerouted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAutomationPolicy"
  /v1/absorption/eligibility-decisions:
    post:
      operationId: evaluateAbsorptionEligibility
      tags: [Absorption]
      description: >-
        Evaluates one request against active policy, patient preference, panel
        exclusions, licensure and jurisdiction, and sensitive-category segmentation.
        Returns an ineligibility reason rather than a silent denial.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId:
                  type: string
                proposedChannel:
                  $ref: "#/components/schemas/AbsorptionChannel"
      responses:
        "200":
          description: Eligibility decision with reason codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEligibilityDecision"
        "409":
          description: Request already dispositioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/absorption/dispositions:
    get:
      operationId: listAbsorptionDispositions
      tags: [Absorption]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: policyId
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - self_care_advice
              - scheduled_with_clinician
              - routed_to_pharmacist
              - routed_to_nurse
              - escalated_urgent
              - patient_declined_automation
      responses:
        "200":
          description: Dispositions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAbsorptionDisposition"
    post:
      operationId: recordAbsorptionDisposition
      tags: [Absorption]
      description: >-
        Records the outcome of an absorbed request with the named accountable
        clinician and the escalation clock that applies.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbsorptionDispositionCreate"
      responses:
        "201":
          description: Disposition recorded and written back to the panel record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAbsorptionDisposition"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/absorption/dispositions/{dispositionId}/escalations:
    parameters:
      - $ref: "#/components/parameters/DispositionId"
    post:
      operationId: escalateDisposition
      tags: [Absorption]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationEventCreate"
      responses:
        "201":
          description: Escalation recorded and routed to a licensed clinician
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEscalationEvent"
  /v1/absorption/dispositions/{dispositionId}/unsafe-flags:
    parameters:
      - $ref: "#/components/parameters/DispositionId"
    post:
      operationId: flagDispositionUnsafe
      tags: [Absorption]
      description: >-
        Single-step front-line flag. Creates a safety signal with a named owner and
        a governance review deadline.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flaggedBy, concern]
              properties:
                flaggedBy:
                  type: string
                concern:
                  type: string
                  enum:
                    - wrong_acuity
                    - missed_red_flag
                    - continuity_broken
                    - sensitive_content_mishandled
                    - patient_confusion
                narrative:
                  type: string
      responses:
        "201":
          description: Safety signal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSafetySignal"
  /v1/safety/surveillance-outcomes:
    get:
      operationId: listSurveillanceOutcomes
      tags: [Safety Surveillance]
      description: >-
        Look-back monitoring of absorbed requests for unplanned emergency visits,
        admissions, and new serious diagnoses within the specialty window.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: policyId
          in: query
          schema:
            type: string
        - name: signalOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Surveillance outcomes page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSurveillanceOutcome"
  /v1/safety/signals:
    get:
      operationId: listSafetySignals
      tags: [Safety Surveillance]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, under_review, actioned, closed]
      responses:
        "200":
          description: Safety signals page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSafetySignal"
  /v1/equity/subgroup-performance:
    get:
      operationId: getSubgroupPerformance
      tags: [Equity]
      description: >-
        Absorption, escalation, and miss rates by demographic cohort with the
        governance threshold and current breach state.
      security:
        - BearerAuth: []
      parameters:
        - name: policyId
          in: query
          required: true
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
        - name: dimension
          in: query
          schema:
            type: string
            enum: [age_band, sex, race_ethnicity, language, payer_class, disability, geography]
      responses:
        "200":
          description: Subgroup performance with suppression applied to small cells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSubgroupPerformance"
  /v1/recovery/statements:
    get:
      operationId: listCapacityRecoveryStatements
      tags: [Recovery Reporting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Recovery statements page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCapacityRecoveryStatement"
  /v1/recovery/statements/{statementId}:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    get:
      operationId: getCapacityRecoveryStatement
      tags: [Recovery Reporting]
      description: >-
        Recovered clinician minutes by role reconciled to payroll and session data,
        with the share converted into access rather than reabsorbed, and value
        stated separately per payment regime.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Capacity recovery statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapacityRecoveryStatement"
  /v1/recovery/statements/{statementId}/sign-off:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    post:
      operationId: signOffCapacityRecoveryStatement
      tags: [Recovery Reporting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signatory, role]
              properties:
                signatory:
                  type: string
                role:
                  type: string
                  enum: [ambulatory_operations, finance, clinical_governance]
                note:
                  type: string
      responses:
        "200":
          description: Statement signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapacityRecoveryStatement"
  /v1/governance/reviews:
    get:
      operationId: listGovernanceReviews
      tags: [Governance]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Governance reviews page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeGovernanceReview"
    post:
      operationId: openGovernanceReview
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceReviewCreate"
      responses:
        "201":
          description: Review opened with owner and deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeGovernanceReview"
  /v1/governance/patients/{patientId}/automation-preference:
    parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setPatientAutomationPreference
      tags: [Governance]
      description: >-
        Records a patient's refusal of automated handling. Refusal must not degrade
        wait time and is enforced ahead of any policy evaluation.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientAutomationPreference"
      responses:
        "200":
          description: Preference recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePatientAutomationPreference"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
    DispositionId:
      name: dispositionId
      in: path
      required: true
      schema:
        type: string
    StatementId:
      name: statementId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: USD
    AbsorptionChannel:
      type: string
      enum:
        - automated_symptom_intake
        - asynchronous_message_response
        - pharmacist_led_refill
        - nurse_protocol_visit
        - community_health_worker
        - self_service_scheduling
    ClinicalCategory:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          description: Local category code mapped to SNOMED CT where available
        label:
          type: string
        snomedConceptId:
          type: string
        specialty:
          type: string
        sensitiveSegment:
          type: string
          enum: [none, behavioural_health, substance_use, reproductive, hiv, genetic, gender_identity]
        deviceClassificationNote:
          type: string
          description: Whether automation of this category falls inside the clinical decision support device boundary
    DemandRequest:
      type: object
      required: [id, sourceChannel, receivedAt, conversionState]
      properties:
        id:
          type: string
        patientRef:
          type: string
          description: Pseudonymous patient key, resolvable only inside the covered-entity boundary
        panelId:
          type: string
        siteId:
          type: string
        specialty:
          type: string
        sourceChannel:
          type: string
          enum: [telephony, portal_message, scheduling_search, referral, registration, walk_in]
        receivedAt:
          type: string
          format: date-time
        clinicalCategory:
          $ref: "#/components/schemas/ClinicalCategory"
        statedReason:
          type: string
          description: Patient-stated reason, retained under the shortest safety-review schedule
        conversionState:
          type: string
          enum: [open, converted, absorbed, expired_unmet, abandoned]
        convertedEncounterRef:
          type: string
        accessWindowDays:
          type: integer
        daysToOffered:
          type: integer
        offeredWithinWindow:
          type: boolean
        sensitiveSegment:
          type: string
          enum: [none, behavioural_health, substance_use, reproductive, hiv, genetic, gender_identity]
    DemandRequestCreate:
      type: object
      required: [sourceChannel, receivedAt]
      properties:
        patientRef:
          type: string
        panelId:
          type: string
        siteId:
          type: string
        specialty:
          type: string
        sourceChannel:
          type: string
          enum: [telephony, portal_message, scheduling_search, referral, registration, walk_in]
        receivedAt:
          type: string
          format: date-time
        categoryCode:
          type: string
        statedReason:
          type: string
        abandonedAt:
          type: string
          format: date-time
        externalReference:
          type: string
    AccessWindowStandard:
      type: object
      required: [specialty, categoryCode, windowDays]
      properties:
        specialty:
          type: string
        categoryCode:
          type: string
        windowDays:
          type: integer
          description: Clinically appropriate days to encounter for this category
        source:
          type: string
          enum: [specialty_society, internal_standard, contract_requirement]
        effectiveFrom:
          type: string
          format: date
    CapacitySnapshot:
      type: object
      required: [id, siteId, specialty, periodStart, availableMinutes]
      properties:
        id:
          type: string
        siteId:
          type: string
        specialty:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        role:
          type: string
          enum: [physician, advanced_practice_provider, registered_nurse, pharmacist, medical_assistant]
        scheduledMinutes:
          type: integer
        availableMinutes:
          type: integer
          description: Scheduled minutes net of leave, administrative time, and blocked template
        leaveMinutes:
          type: integer
        administrativeMinutes:
          type: integer
        payrollReconciled:
          type: boolean
    CapacitySnapshotCreate:
      type: object
      required: [siteId, specialty, periodStart, availableMinutes]
      properties:
        siteId:
          type: string
        specialty:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        role:
          type: string
        scheduledMinutes:
          type: integer
        availableMinutes:
          type: integer
        leaveMinutes:
          type: integer
        administrativeMinutes:
          type: integer
    ClinicianProfile:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [physician, advanced_practice_provider, registered_nurse, pharmacist]
        licensedJurisdictions:
          type: array
          items:
            type: string
        credentialedSpecialties:
          type: array
          items:
            type: string
        acceptsAccountabilityFor:
          type: array
          items:
            type: string
          description: Policy identifiers for which this clinician is the accountable clinician
    PanelAssignment:
      type: object
      required: [panelId, owningClinicianId]
      properties:
        panelId:
          type: string
